<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>▣ Hustle & Sacrifice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F0EEF8;--sf:rgba(255,255,255,0.75);--cd:rgba(255,255,255,0.5);--br:rgba(255,255,255,0.6);
  --tx:#1A1A2E;--t2:#4A5568;--t3:#9AA5B4;
  --go:#B45309;--gb:#D97706;--gn:#027A48;--gn2:#12B76A;--rd:#B42318;--rd2:#F04438;--bl:#1D4ED8;--bl2:#2563EB;--pu:#6941C6;
  --glass:rgba(255,255,255,0.65);--glass-border:rgba(255,255,255,0.8);
  --sh:0 4px 24px rgba(80,60,140,.08),0 1.5px 6px rgba(80,60,140,.04);
  --shm:0 12px 40px rgba(80,60,140,.14),0 3px 10px rgba(80,60,140,.07);
  --blur:blur(18px);
}
body{
  background:#E8E4F3;color:var(--tx);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  height:100vh;height:100dvh;overflow:hidden;
  transition:background .2s,color .2s;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse at 15% 20%,rgba(196,181,253,0.55) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 10%,rgba(251,207,232,0.45) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 80%,rgba(167,243,208,0.35) 0%,transparent 50%),
    radial-gradient(ellipse at 20% 85%,rgba(253,230,138,0.3) 0%,transparent 45%);
}
body.dark{
  --bg:#0D0D1A;--sf:rgba(20,20,40,0.8);--cd:rgba(30,30,55,0.6);--br:rgba(255,255,255,0.07);
  --tx:#E8E4F8;--t2:#8892A4;--t3:#3D4D66;
  --glass:rgba(18,18,35,0.75);--glass-border:rgba(255,255,255,0.08);
  background:#0D0D1A;
  background-image:
    radial-gradient(ellipse at 15% 20%,rgba(109,40,217,0.2) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 10%,rgba(219,39,119,0.12) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 80%,rgba(6,78,59,0.2) 0%,transparent 50%);
}
body.dark .card,.dark .mc,.dark .sc,.dark .gauge-card,.dark .contact-card,.dark .debt-card,.dark .banner,.dark .crd,.dark .hero-card{
  background:rgba(20,20,40,0.8);border-color:rgba(255,255,255,0.07);
}
body.dark .ipt{background:rgba(15,15,32,0.9);border-color:rgba(255,255,255,0.1);color:#E8E4F8;}
body.dark .jtxt{background:rgba(15,15,32,0.9);border-color:rgba(255,255,255,0.1);color:#E8E4F8;}
body.dark .fin-row:hover{background:rgba(255,255,255,0.04);}
body.dark .nbtn.on{background:rgba(217,119,6,.15);color:#FBBF24;}
body.dark .nbtn:hover{background:rgba(255,255,255,0.05);}
body.dark .sb-section{color:rgba(255,255,255,0.25);}
.layout{display:flex;height:100vh;height:100dvh;}

/* ── SIDEBAR ─── pill, icon-only, glass ── */
.sb{
  width:68px;background:rgba(255,255,255,0.65);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-right:1px solid rgba(255,255,255,0.7);
  display:flex;flex-direction:column;align-items:center;
  padding:0;flex-shrink:0;overflow:hidden;
  box-shadow:2px 0 20px rgba(80,60,140,0.07);
}
.sb::-webkit-scrollbar{display:none;}
.sb-logo{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;
  letter-spacing:2px;color:#fff;
  width:40px;height:40px;border-radius:13px;
  background:linear-gradient(135deg,#FBBF24,#D97706);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin:16px 0 12px;
  box-shadow:0 4px 12px rgba(217,119,6,0.3);
}
.sb-logo-icon{display:none;}
.sb-logo-badge{display:none;}
.sb-nav{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;padding:4px 0;gap:1px;overflow-y:auto;}
.sb-nav::-webkit-scrollbar{display:none;}
.sb-section{display:none;}
.nbtn{
  width:44px;height:44px;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:none;background:transparent;color:var(--t3);
  cursor:pointer;transition:all .15s;position:relative;
}
.nbtn:hover{background:rgba(255,255,255,0.75);color:var(--tx);}
.nbtn.on{background:rgba(217,119,6,0.13);color:#D97706;}
.nbtn.on .nico{color:#D97706;}
.nico{font-size:20px;line-height:1;transition:color .15s;}
.nlbl{font-size:8px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;color:inherit;white-space:nowrap;}
.nbtn.on .nlbl{color:#D97706;}
.sb-footer{padding:10px 0 12px;border-top:1px solid rgba(255,255,255,0.5);margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;width:100%;}
/* Sub-nav pills */
.subnav{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 14px;}
.snbtn{border:1.5px solid rgba(255,255,255,0.7);background:rgba(255,255,255,0.5);backdrop-filter:var(--blur);
  color:var(--t2);font-size:12px;font-weight:600;padding:6px 14px;border-radius:99px;
  cursor:pointer;transition:all .15s;white-space:nowrap;}
.snbtn:hover{background:rgba(255,255,255,0.85);color:var(--tx);}
.snbtn.on{background:rgba(217,119,6,0.12);border-color:#D97706;color:#92400E;font-weight:700;}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;background:transparent;display:flex;flex-direction:column;}
.main::-webkit-scrollbar{width:4px;}
.main::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:4px;}
.pg-header{
  background:rgba(255,255,255,0.55);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid rgba(255,255,255,0.7);
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  box-shadow:0 2px 12px rgba(80,60,140,0.06);
}
.pg-title{font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--tx);}
.pg-sub{font-size:11px;color:var(--t3);margin-top:1px;}
.pg-body{padding:20px 24px;flex:1;}

/* ── GLASS CARDS ── */
.card{
  background:rgba(255,255,255,0.65);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,0.8);
  border-radius:20px;padding:20px 22px;margin-bottom:14px;
  box-shadow:0 4px 24px rgba(80,60,140,0.08),0 1px 4px rgba(80,60,140,0.04);
  transition:box-shadow .2s;
}
.card:hover{box-shadow:0 8px 32px rgba(80,60,140,0.12),0 2px 8px rgba(80,60,140,0.06);}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap;}
.pt{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--t3);}
.lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);display:block;margin-bottom:4px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.mc{
  background:rgba(255,255,255,0.65);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,0.8);border-radius:18px;padding:16px 18px;
  position:relative;overflow:hidden;box-shadow:var(--sh);
}
.mc-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:18px 18px 0 0;}
.mlbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:10px;}
.mval{font-size:24px;font-weight:700;line-height:1;margin-bottom:4px;letter-spacing:-1px;}
.msub{font-size:11px;color:var(--t3);line-height:1.5;}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px;}
.mac{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
.pbg{background:rgba(0,0,0,0.08);border-radius:99px;height:7px;overflow:hidden;margin-top:6px;}
.pf{height:100%;border-radius:99px;background:var(--gn2);transition:width .5s;}

/* ── GAUGE CARDS ── */
.gauge-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.gauge-card{
  background:rgba(255,255,255,0.65);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,0.8);border-radius:20px;
  padding:20px 12px 16px;box-shadow:var(--sh);text-align:center;position:relative;overflow:hidden;
}

/* ── HERO ── */
.hero-card{background:rgba(255,255,255,0.65);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,0.8);border-radius:20px;padding:24px 26px;margin-bottom:16px;box-shadow:var(--sh);position:relative;overflow:hidden;}
.hero-card::before{content:'';position:absolute;top:0;right:0;width:260px;height:260px;background:radial-gradient(circle at top right,rgba(217,119,6,.06),transparent 65%);pointer-events:none;}
.hero-greeting{font-size:25px;font-weight:700;letter-spacing:-.5px;color:var(--tx);margin-bottom:2px;}
.hero-date{font-size:13px;color:var(--t3);margin-bottom:16px;}
.hero-xpbg{background:rgba(0,0,0,0.08);border-radius:99px;height:7px;overflow:hidden;margin-bottom:6px;}
.hero-xpfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#D97706,#FBBF24);transition:width .6s;box-shadow:0 0 8px rgba(217,119,6,.3);}
.hero-meta{font-size:11px;color:var(--t3);margin-bottom:14px;}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;}
.hero-pill{font-size:12px;font-weight:600;padding:5px 14px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;letter-spacing:.2px;}

/* ── BUTTONS / INPUTS ── */
.btn{
  background:rgba(255,255,255,0.6);border:1.5px solid rgba(255,255,255,0.8);color:var(--t2);
  padding:6px 14px;border-radius:10px;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  cursor:pointer;transition:all .15s;white-space:nowrap;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
.btn:hover{background:rgba(255,255,255,0.9);color:var(--tx);}
.bg{border-color:#D97706!important;color:#92400E!important;background:rgba(251,191,36,0.15)!important;}
.bg:hover{background:#D97706!important;color:#fff!important;}
.br2{border-color:var(--rd)!important;color:var(--rd)!important;}
.br2:hover{background:var(--rd)!important;color:#fff!important;}
.bb{border-color:var(--bl)!important;color:var(--bl)!important;}
.bb:hover{background:var(--bl)!important;color:#fff!important;}
.ipt{
  background:rgba(255,255,255,0.6);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1.5px solid rgba(255,255,255,0.8);color:var(--tx);
  padding:8px 12px;border-radius:12px;font-size:13px;outline:none;
  transition:all .15s;width:100%;font-family:'Inter',inherit;
}
.ipt:focus{border-color:#D97706;box-shadow:0 0 0 3px rgba(217,119,6,.1);background:rgba(255,255,255,0.85);}
.row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.06);}
.row:last-child{border-bottom:none;}
.rt{flex:1;font-size:13px;color:var(--tx);line-height:1.4;}
.rt.dn{color:var(--t3);text-decoration:line-through;}
.chk{width:19px;height:19px;border:2px solid rgba(0,0,0,0.15);border-radius:6px;background:rgba(255,255,255,0.6);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;transition:all .15s;margin-top:1px;}
.chk.on{background:var(--gn);border-color:var(--gn);color:#fff;}
.bdg{font-size:9px;font-weight:700;padding:3px 8px;border-radius:99px;flex-shrink:0;margin-top:2px;letter-spacing:.5px;}
.bH{background:rgba(254,228,226,0.9);color:#B42318;}
.bM{background:rgba(254,240,199,0.9);color:#92400E;}
.bL{background:rgba(220,250,230,0.9);color:#027A48;}
.sess{flex:1;border:1.5px solid rgba(255,255,255,0.7);background:rgba(255,255,255,0.4);color:var(--t2);padding:9px 3px;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;cursor:pointer;transition:all .12s;text-align:center;backdrop-filter:var(--blur);}
.sess.on{background:rgba(220,250,230,0.8);border-color:var(--gn);color:var(--gn);}
.sess:hover:not(.on){border-color:#D97706;color:#92400E;background:rgba(251,191,36,0.12);}
.jtxt{background:rgba(255,255,255,0.6);backdrop-filter:var(--blur);border:1.5px solid rgba(255,255,255,0.8);color:var(--tx);font-family:Georgia,serif;font-size:14px;line-height:1.8;padding:12px 14px;width:100%;resize:none;border-radius:12px;outline:none;}
.jtxt:focus{border-color:#D97706;box-shadow:0 0 0 3px rgba(217,119,6,.1);}
.jlbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#92400E;display:block;margin-bottom:6px;}
.crd{background:rgba(255,255,255,0.5);border:1.5px solid rgba(255,255,255,0.75);border-radius:14px;padding:12px;backdrop-filter:var(--blur);}
.fin-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(0,0,0,0.05);font-size:13px;transition:background .12s;}
.fin-row:hover{background:rgba(255,255,255,0.4);}
.xbtn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px;padding:0 3px;flex-shrink:0;line-height:1;transition:color .12s;}
.xbtn:hover{color:var(--rd2);}
.stock-num{font-size:42px;font-weight:700;line-height:1;letter-spacing:-2px;}
.pomo-time{font-family:'Barlow Condensed',sans-serif;font-size:64px;font-weight:700;letter-spacing:5px;line-height:1;}
.scell{width:12px;height:12px;border-radius:3px;flex-shrink:0;cursor:default;}
.banner{background:rgba(255,251,235,0.75);backdrop-filter:var(--blur);border:1px solid rgba(251,191,36,0.4);border-radius:18px;padding:16px 20px;margin-bottom:14px;box-shadow:var(--sh);}
.notif{position:fixed;top:18px;right:22px;background:rgba(255,255,255,0.9);backdrop-filter:var(--blur);border-left:3px solid #D97706;color:#92400E;font-size:12px;padding:11px 18px;border-radius:14px;z-index:9999;box-shadow:var(--shm);animation:slin .3s ease;pointer-events:none;font-weight:600;letter-spacing:.2px;}
@keyframes slin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.contact-card{background:rgba(255,255,255,0.65);backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,0.8);border-radius:16px;padding:14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh);transition:box-shadow .15s;}
.contact-card:hover,.contact-card.on{box-shadow:var(--shm);}
.debt-card{background:rgba(255,255,255,0.65);backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,0.8);border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:var(--sh);}
.debt-hdr{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .1s;border-radius:16px;}
.debt-hdr:hover{background:rgba(0,0,0,0.03);}
.sc{background:rgba(255,255,255,0.65);backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,0.8);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--sh);}
.scv{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.5px;}
.scl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);}
body.dark .sb{background:rgba(12,12,25,0.9);border-right-color:rgba(255,255,255,0.06);}
body.dark .nbtn{color:rgba(255,255,255,0.3);}
body.dark .nbtn:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.75);}
body.dark .nbtn.on{background:rgba(217,119,6,0.18);color:#F59E0B;}
body.dark .nbtn.on .nico,.body.dark .nbtn.on .nlbl{color:#F59E0B;}
body.dark .snbtn{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);}
body.dark .snbtn:hover{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.85);}
body.dark .snbtn.on{background:rgba(217,119,6,0.18);border-color:#D97706;color:#F59E0B;}
body.dark .pg-header{background:rgba(12,12,25,0.8);border-bottom-color:rgba(255,255,255,0.06);}
body.dark .gauge-card{background:rgba(20,20,40,0.8);border-color:rgba(255,255,255,0.07);}
body.dark .nbtn.on{background:rgba(217,119,6,.15);border-color:transparent;color:#F59E0B;}
body.dark .card{background:rgba(20,20,40,0.8);border-color:rgba(255,255,255,0.07);}
body.dark .ipt{background:rgba(12,12,25,0.85);border-color:rgba(255,255,255,0.1);color:#E8E4F8;}
body.dark .btn{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.1);}
body.dark .crd{background:rgba(25,25,50,0.7);border-color:rgba(255,255,255,0.08);}
body.dark .hero-xpbg{background:rgba(255,255,255,0.08);}
body.dark .pbg{background:rgba(255,255,255,0.08);}
body.dark .row{border-bottom-color:rgba(255,255,255,0.06);}
body.dark .fin-row:hover{background:rgba(255,255,255,0.04);}
body.dark .chk{border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);}
body.dark .sess{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1);}
body.dark .jtxt{background:rgba(12,12,25,0.85);border-color:rgba(255,255,255,0.1);}
body.dark .sc,.body.dark .mc,.body.dark .debt-card,.body.dark .contact-card{background:rgba(20,20,40,0.8);border-color:rgba(255,255,255,0.07);}
body.dark .banner{background:rgba(40,30,10,0.8);border-color:rgba(217,119,6,0.3);}
body.dark .sb-section{color:rgba(255,255,255,0.2);}
body.dark .notif{background:rgba(20,20,40,0.95);color:#F59E0B;}

/* ── SCROLLBAR ── */
.main::-webkit-scrollbar{width:4px;}
.main::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.12);border-radius:4px;}

/* ── MOBILE ── */
@media(max-width:640px){
  .layout{flex-direction:column;}
  .sb{width:100%;height:60px;flex-direction:row;align-items:stretch;border-right:none;border-top:1px solid rgba(255,255,255,0.6);order:2;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:0;flex-shrink:0;box-shadow:0 -2px 20px rgba(80,60,140,0.1);}
  .sb::-webkit-scrollbar{display:none;}
  .sb-logo,.sb-section,.sb-footer{display:none;}
  .sb-nav{flex-direction:row;padding:5px 8px;gap:2px;width:auto;align-items:center;overflow-x:auto;overflow-y:hidden;}
  .nbtn{flex-direction:column;padding:4px 10px;width:auto;min-width:52px;flex-shrink:0;border-radius:10px;height:50px;gap:2px;justify-content:center;}
  .nbtn.on{background:rgba(217,119,6,0.12);}
  .nico{font-size:19px;}
  .nlbl{font-size:9px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;}
  .subnav{padding:0 0 12px;gap:5px;}
  .snbtn{font-size:11px;padding:5px 11px;}
  .main{order:1;overflow-x:hidden;display:block;}
  .pg-header{padding:12px 16px;}
  .pg-body{padding:12px 14px;}
  .pg-title{font-size:18px;}
  .g2,.g3,.g4,.bento,.gauge-row{grid-template-columns:1fr;}
  .ig2{grid-template-columns:1fr!important;}
  .tbl-x{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:0 12px;}
  .hero-card{padding:16px 18px;}
  .hero-greeting{font-size:20px;}

function dXP(t,h,f,j,protos){let x=0;(t||[]).filter(i=>i.done).forEach(i=>x+=i.pri==='H'?25:i.pri==='M'?15:10);(protos||[]).forEach(p=>{if(h?.[p.id])x+=(p.xp||20);});['run','gym','sprint','marathon'].forEach(k=>{if(f?.[k])x+=30;});if(+f?.cal>0)x+=10;if(f?.weight)x+=10;if(Object.values(j||{}).filter(v=>v?.trim().length>10).length>=3)x+=40;return x;}

function calcStreak(ad){if(!ad?.length)return 0;const s=new Set(ad);let n=0,d=new Date(),ds=d.toISOString().split('T')[0];if(!s.has(ds)){d.setDate(d.getDate()-1);ds=d.toISOString().split('T')[0];}while(s.has(ds)&&n<365){n++;d.setDate(d.getDate()-1);ds=d.toISOString().split('T')[0];}return n;}
function calcScore(t,h,f,j,protos){

function prescribe(rd,km,dow){

// Accurate balance: compounds interest + monthly/annual fees on statement date, applies payments and one-off charges
function debtBal(d){
  const hasBD=d.balanceDate&&d.currentBal!==undefined;
  const startBal=hasBD?+d.currentBal:(+d.original||0);
  const startDate=new Date((hasBD?d.balanceDate:TODAY)+'T12:00');
  const rate=(+d.rate||0)/100/12;
  const dueDay=+d.dueDay||1;
  const mFee=+d.monthlyFee||0;
  const aFee=+d.annualFee||0;
  const aFeeMonth=+d.annualFeeMonth||1;
  const pmts=[...(d.payments||[])].filter(p=>!hasBD||p.date>=d.balanceDate).sort((a,b)=>a.date>b.date?1:-1);
  const chrgs=[...(d.charges||[])].filter(c=>!hasBD||c.date>=d.balanceDate).sort((a,b)=>a.date>b.date?1:-1);
  if(!rate&&!mFee&&!aFee&&!chrgs.length){
    return Math.max(0,startBal-pmts.reduce((s,p)=>s+(+p.amount||0),0));
  }
  const now=new Date();let bal=startBal,pi=0,ci=0;
  let due=new Date(startDate.getFullYear(),startDate.getMonth(),dueDay);
  if(due<=startDate)due=new Date(due.getFullYear(),due.getMonth()+1,dueDay);
  while(due<=now){
    // Payments landed before this statement
    while(pi<pmts.length&&new Date(pmts[pi].date+'T12:00')<due){bal=Math.max(0,bal-(+pmts[pi].amount||0));pi++;}
    // One-off charges (late fees etc.) before this statement
    while(ci<chrgs.length&&new Date(chrgs[ci].date+'T12:00')<due){bal+=(+chrgs[ci].amount||0);ci++;}
    // Monthly account fee
    if(mFee)bal+=mFee;
    // Annual fee on its month
    if(aFee&&(due.getMonth()+1)===aFeeMonth)bal+=aFee;
    // Interest on full closing balance (after fees)
    if(rate)bal+=bal*rate;
    due=new Date(due.getFullYear(),due.getMonth()+1,dueDay);
  }
  while(pi<pmts.length){bal=Math.max(0,bal-(+pmts[pi].amount||0));pi++;}
  while(ci<chrgs.length){bal+=(+chrgs[ci].amount||0);ci++;}
  return Math.max(0,bal);
}
// % paid off
function debtPct(d){const o=+d.original||+d.currentBal||0;return o?Math.min(100,Math.max(0,(1-debtBal(d)/o)*100)):0;}
// What hits on the next statement date (interest + fees)
function debtNextStatement(d){
  const rate=(+d.rate||0)/100/12;
  const mFee=+d.monthlyFee||0;const aFee=+d.annualFee||0;const aFeeMonth=+d.annualFeeMonth||1;
  const bal=debtBal(d);if(bal<=0)return null;
  const dueDay=+d.dueDay||1;const now=new Date();
  let due=new Date(now.getFullYear(),now.getMonth(),dueDay);
  if(due<=now)due=new Date(due.getFullYear(),due.getMonth()+1,dueDay);
  const isAnnual=aFee&&(due.getMonth()+1)===aFeeMonth;
  const interest=rate?bal*rate:0;
  const fees=mFee+(isAnnual?aFee:0);
  if(!interest&&!fees)return null;
  return{interest,fees,total:interest+fees,date:due.toISOString().split('T')[0],isAnnual:!!isAnnual};
}

function simCalc(debts,budget,strategy){
  if(!debts.length||budget<=0)return null;
  const RD=26*100,MAX=26*40;
  let st=debts.map(d=>({id:d.id,name:d.name,bal:debtBal(d),rate:+d.rate||0,minP:+d.minPay||0,int:0,paidFt:null}));
  const totMin=st.reduce((s,d)=>s+d.minP,0);
  if(totMin>budget)return{err:'Budget '+FMT(budget)+' is less than total minimums '+FMT(totMin)};
  const fa={};let ft=0;
  const gOrd=()=>{const a=st.filter(d=>d.paidFt===null&&d.bal>0.01);return strategy==='avalanche'?a.sort((a,b)=>b.rate-a.rate):a.sort((a,b)=>a.bal-b.bal);};
  while(st.some(d=>d.paidFt===null&&d.bal>0.01)&&ft<MAX){
    ft++;
    for(const d of st){if(d.paidFt!==null||d.bal<=0.01)continue;const i=d.bal*d.rate/RD;d.bal+=i;d.int+=i;}
    let av=budget;
    const focId=gOrd()[0]?.id;
    for(const d of st){if(d.paidFt!==null||d.bal<=0.01)continue;const pay=Math.min(d.minP,d.bal);d.bal=Math.max(0,d.bal-pay);av-=pay;if(ft===1)fa[d.id]={amt:pay,focus:false};if(d.bal<=0.01){d.bal=0;d.paidFt=ft;}}
    if(av>0.01){const foc=st.find(d=>d.id===focId);if(foc&&foc.bal>0.01){const ex=Math.min(av,foc.bal);foc.bal=Math.max(0,foc.bal-ex);if(ft===1)fa[foc.id]={amt:(fa[foc.id]?.amt||0)+ex,focus:true};if(foc.bal<=0.01){foc.bal=0;foc.paidFt=ft;}}}
  }
  return{state:st,fa,maxFt:Math.max(...st.map(d=>d.paidFt||ft)),totalInt:st.reduce((s,d)=>s+d.int,0),err:null};
}
function simMin(debts){
  if(!debts.length)return null;
  const RD=26*100,MAX=26*40;
  let st=debts.map(d=>({bal:debtBal(d),rate:+d.rate||0,minP:+d.minPay||0,int:0}));
  let ft=0;
  while(st.some(d=>d.bal>0.01)&&ft<MAX){ft++;for(const d of st){if(d.bal<=0.01)continue;const i=d.bal*d.rate/RD;d.bal+=i;d.int+=i;const pay=Math.min(d.minP,d.bal);d.bal=Math.max(0,d.bal-pay);}}
  return{maxFt:ft,totalInt:st.reduce((s,d)=>s+d.int,0)};
}
// Graph simulation — records balance per debt every 2 fortnights (≈monthly)
function simPaydownGraph(debts,budget,strategy){
  if(!debts.length||budget<=0)return null;
  const RD=26*100,MAX=26*12;
  let st=debts.map(d=>({id:d.id,name:d.name,bal:debtBal(d),rate:+d.rate||0,minP:+d.minPay||0}));
  const totMin=st.reduce((s,d)=>s+d.minP,0);
  if(totMin>budget)return null;
  const snap=()=>Object.fromEntries(st.map(d=>[d.id,Math.max(0,d.bal)]));
  const history=[{ft:0,s:snap()}];
  let ft=0;
  const gOrd=()=>{const a=st.filter(d=>d.bal>0.01);return strategy==='avalanche'?[...a].sort((a,b)=>b.rate-a.rate):[...a].sort((a,b)=>a.bal-b.bal);};
  while(st.some(d=>d.bal>0.01)&&ft<MAX){
    ft++;
    for(const d of st){if(d.bal<=0.01)continue;d.bal+=d.bal*d.rate/RD;}
    let av=budget;const focId=gOrd()[0]?.id;
    for(const d of st){if(d.bal<=0.01)continue;const pay=Math.min(d.minP,d.bal);d.bal=Math.max(0,d.bal-pay);av-=pay;}
    if(av>0.01){const f=st.find(d=>d.id===focId);if(f&&f.bal>0.01)f.bal=Math.max(0,f.bal-Math.min(av,f.bal));}
    if(ft%2===0||!st.some(d=>d.bal>0.01))history.push({ft,s:snap()});
  }
  return{history,maxFt:ft,ids:st.map(d=>d.id),names:Object.fromEntries(st.map(d=>[d.id,d.name]))};
}

function getPascha(yr){
  const a=yr%4,b=yr%7,c=yr%19,d=(19*c+15)%30,e=(2*a+4*b+6*d+6)%7;
  let day=22+d+e,mon=3;if(day>31){day-=31;mon=4;}
  const j=new Date(yr,mon-1,day);j.setDate(j.getDate()+13);return j;
}
function getOrthoInfo(ds){
  const dt=new Date(ds+'T12:00'),yr=dt.getFullYear();
  const mm=String(dt.getMonth()+1).padStart(2,'0'),dd=String(dt.getDate()).padStart(2,'0'),mmdd=mm+'-'+dd;
  const pascha=getPascha(yr);
  const dsp=Math.round((dt-pascha)/86400000);
  const FEASTS={'01-06':'Theophany','02-02':'Presentation of Christ','03-25':'Annunciation',
    '08-06':'Transfiguration','08-15':'Dormition of the Theotokos','09-08':'Nativity of the Theotokos',
    '09-14':'Elevation of the Holy Cross','11-21':'Entrance of the Theotokos','12-25':'Nativity of Christ'};
  const MOV={'-63':'Sunday of the Publican & Pharisee','-49':'Prodigal Son Sunday',
    '-42':'Meatfare Sunday','-35':'Cheesefare Sunday','-7':'Palm Sunday',
    '0':'Holy Pascha','39':'Ascension of Christ','49':'Pentecost','56':'All Saints Sunday'};
  const feast=MOV[String(dsp)]||FEASTS[mmdd]||null;
  const dow=dt.getDay();
  const dFast=mm==='08'&&+dd>=1&&+dd<=14;
  const nFast=(mm==='11'&&+dd>=15)||(mm==='12'&&+dd<=24);
  const allSaints=new Date(pascha.getTime()+56*86400000);
  const jun28=new Date(yr,5,28);
  const aFast=dt>allSaints&&dt<=jun28&&yr===allSaints.getFullYear();
  let fast=null,fNote='',fastCol='var(--t3)';
  if(dsp>=0&&dsp<=6){fast=null;fNote='Bright Week — no fasting';}
  else if(dsp>=-7&&dsp<=-1){fast='No meat';fNote='Cheesefare Week';fastCol='var(--go)';}
  else if(dsp>=-48&&dsp<-7){
    if(dow===0){fast='No meat/dairy';fNote='Great Lent (Sunday)';fastCol='var(--pu)';}
    else if(dow===3||dow===5){fast='Strict fast';fNote='Great Lent';fastCol='var(--rd2)';}
    else{fast='No meat/dairy';fNote='Great Lent';fastCol='var(--pu)';}
  }
  else if(dFast){fast=dow===3||dow===5?'Strict fast':'No meat/dairy';fNote='Dormition Fast';fastCol=fast==='Strict fast'?'var(--rd2)':'var(--pu)';}
  else if(nFast){fast=dow===3||dow===5?'Strict fast':dow===0||dow===6?'Fish OK':'No meat/dairy';fNote='Nativity Fast';fastCol=fast==='Strict fast'?'var(--rd2)':'var(--pu)';}
  else if(aFast){fast=dow===3||dow===5?'Strict fast':'No meat';fNote='Apostles Fast';fastCol=fast==='Strict fast'?'var(--rd2)':'var(--go)';}
  else if(dow===3||dow===5){fast='Lenient fast';fNote='Wednesday/Friday fast';fastCol='var(--gn)';}
  return{feast,fast,fNote,fastCol};
}

const ensureAudio=()=>{

};
// Play beep alarm — 3 rising tones for work done, 1 low tone for break done
const playAlarm=mode=>{
  const ctx=audioCtxRef.current;if(!ctx)return;
  if(ctx.state==='suspended')ctx.resume();
  const seq=mode==='work'?[[660,.18],[880,.18],[1108,.28]]:[[440,.35]];
  seq.forEach(([f,d],i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';o.frequency.value=f;
    const t=ctx.currentTime+i*.28;
    g.gain.setValueAtTime(.55,t);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.start(t);o.stop(t+d+.05);
  });
};

// Debt recommendation engine
const debtRec=useMemo(()=>{
  if(!debts.length)return null;
  const active=debts.map(d=>{
    const bal=debtBal(d);
    const monthlyInt=bal*(+d.rate||0)/100/12;
    const mFees=(+d.monthlyFee||0);
    const monthlyCost=monthlyInt+mFees;
    const effectiveRate=bal>0?((monthlyInt+mFees)/bal)*12*100:+d.rate||0;
    return{...d,bal,monthlyInt,mFees,monthlyCost,effectiveRate};
  }).filter(d=>d.bal>0.01);
  if(!active.length)return null;
  const byRate=[...active].sort((a,b)=>b.effectiveRate-a.effectiveRate);
  const byBal=[...active].sort((a,b)=>a.bal-b.bal);
  const totalCost=active.reduce((s,d)=>s+d.monthlyCost,0);
  const totalBal=active.reduce((s,d)=>s+d.bal,0);
  // Interest saved by avalanche vs minimum-only: rough estimate
  const worstRate=byRate[0]?.effectiveRate||0;
  return{active,avalanche:byRate[0],snowball:byBal[0],byRate,totalCost,totalBal,worstRate};
},[debts]);

// ─── GAUGE COMPONENT ───────────────────────────────────────────
const Gauge=(value,target,topLabel,bottomLabel,accentColor)=>{
  const num=typeof value==='number'?value:parseFloat(value)||0;
  const pct=target>0?Math.min(1,Math.max(0,num/target)):0;
  const R=62,CX=90,CY=82;
  const START=-216,TOTAL=252;
  const toRad=d=>d*Math.PI/180;
  const px=d=>CX+R*Math.cos(toRad(d));
  const py=d=>CY+R*Math.sin(toRad(d));
  const arc=(sweep)=>{
    if(sweep<=0.01)return '';
    const safe=Math.min(sweep,TOTAL-0.2);
    const lg=safe>180?1:0;
    return `M${px(START)},${py(START)} A${R},${R} 0 ${lg} 1 ${px(START+safe)},${py(START+safe)}`;
  };
  const fc=accentColor||(pct<0.4?'#F04438':pct<0.7?'#F59E0B':'#12B76A');
  const dv=typeof value==='string'?value:(num||0).toLocaleString();
  return el('div',{className:'gauge-card'},
    el('div',{style:{fontSize:9,fontWeight:700,letterSpacing:2,textTransform:'uppercase',color:'var(--t3)',marginBottom:10}},topLabel),
    el('div',{style:{position:'relative',width:'min(164px,80%)',height:100,margin:'0 auto'}},
      el('svg',{viewBox:'0 0 180 110',style:{width:'100%',height:'100%',overflow:'visible'}},
        el('path',{d:arc(TOTAL),fill:'none',stroke:'var(--br)',strokeWidth:10,strokeLinecap:'round'}),
        pct>0.005&&el('path',{d:arc(TOTAL*pct),fill:'none',stroke:fc,strokeWidth:10,strokeLinecap:'round',style:{filter:`drop-shadow(0 0 5px ${fc}88)`,transition:'stroke-dashoffset .4s'}})
      ),
      el('div',{style:{position:'absolute',bottom:0,left:0,right:0,textAlign:'center'}},
        el('div',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:38,fontWeight:700,color:fc,lineHeight:1,letterSpacing:-1}},dv)
      )
    ),
    el('div',{style:{marginTop:10}},
      el('div',{style:{fontSize:11,fontWeight:700,color:'var(--tx)',marginBottom:3}},bottomLabel),
      el('div',{style:{fontSize:10,color:'var(--t3)'}},target?`Target: ${typeof target==='number'?target.toLocaleString():target}`:'')
    )
  );
};
// ─── SPARKLINE CHART ───────────────────────────────────────────
const SparkLine=(points,color,height=60)=>{
  if(!points||points.length<2)return null;
  const W=300,H=height;
  const mx=Math.max(...points,1);
  const mn=Math.min(...points,0);
  const rng=mx-mn||1;
  const scY=v=>H-((v-mn)/rng)*(H*0.88)-H*0.06;
  const scX=(_,i)=>(i/(points.length-1))*W;
  const pts=points.map((v,i)=>`${scX(v,i)},${scY(v)}`).join(' ');
  const area=`M${scX(0,0)},${H} `+points.map((v,i)=>`L${scX(v,i)},${scY(v)}`).join(' ')+` L${W},${H} Z`;
  return el('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',height,display:'block',overflow:'visible'}},
    el('defs',null,
      el('linearGradient',{id:'sgfill',x1:'0',y1:'0',x2:'0',y2:'1'},
        el('stop',{offset:'0%',stopColor:color||'#D97706',stopOpacity:'.2'}),
        el('stop',{offset:'100%',stopColor:color||'#D97706',stopOpacity:'0'})
      )
    ),
    el('path',{d:area,fill:'url(#sgfill)'}),
    el('polyline',{points:pts,fill:'none',stroke:color||'#D97706',strokeWidth:2.5,strokeLinejoin:'round',strokeLinecap:'round'})
  );
};

      FR('Doom scroll (h)',el('input',{className:'ipt',type:'number',step:'.1',value:newScreen.doom,onChange:e=>setNewScreen(p=>({...p,doom:e.target.value}))}))
    ]),
    FR('Note',el('input',{className:'ipt',value:newScreen.note,onChange:e=>setNewScreen(p=>({...p,note:e.target.value})),placeholder:'Optional'})),
    el('div',{style:{marginTop:10,marginBottom:10}},Btn('Log Screen Time',doAddScreen,'bg')),

      el('span',{style:{flex:1,fontSize:12,color:'var(--t3)',marginLeft:8}},s.note||''),
      Xb(()=>delScreen(s.id))
    ))
  );
};

  {id:'money',icon:'ti-coin',   label:'Money',  tabs:['money']},
  {id:'plan', icon:'ti-checklist',label:'Plan',tabs:['plan','learn']},
  {id:'me',   icon:'ti-user',   label:'Me',     tabs:['people','notes','reflect','journal','review']},
];
const TAB_MAP=Object.fromEntries(ALL_TABS.map(t=>[t[0],t]));
const tabLabel={home:'Home',tilt:'TILT',training:'Training','content-cal':'Content',halfmarathon:'Half Marathon',gym:'Gym',money:'Money',plan:'Plan',learn:'Learn',people:'People',notes:'Notes',reflect:'Reflect',journal:'Journal',sync:'Sync',morning:'Morning',wellness:'Sleep & Wellness',review:'Weekly Review',stockists:'Stockists'};
// Which section is active based on current tab
const activeSection=SECTIONS.find(s=>s.tabs.includes(tab))||SECTIONS[0];
const subTabs=activeSection.tabs.filter(k=>TAB_MAP[k]);

const goSection=sid=>{
  const sec=SECTIONS.find(s=>s.id===sid);
  if(!sec)return;
  setSection(sid);
  setTab(sec.tabs[0]);
};

    el('div',{style:{background:'var(--sf)',backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',border:'1px solid rgba(255,255,255,0.8)',borderRadius:20,padding:24,width:'100%',maxWidth:520,maxHeight:'90vh',overflowY:'auto',boxShadow:'0 20px 60px rgba(0,0,0,0.25)'}},
      el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}},
        el('div',null,
          el('div',{style:{fontSize:10,fontWeight:700,letterSpacing:2,textTransform:'uppercase',color:'var(--t3)',marginBottom:2}},TODAY),
          el('div',{style:{fontSize:20,fontWeight:700,color:'var(--tx)'}},'🌙 End of Day Review')

      (wp.p1||wp.p2||wp.p3)&&el('div',{style:{background:'rgba(255,255,255,0.5)',borderRadius:12,padding:12,marginBottom:16}},

class ErrBoundary extends React.Component{constructor(p){super(p);this.state={err:null};}static getDerivedStateFromError(e){return{err:e};}render(){if(this.state.err)return React.createElement('div',{style:{padding:32,fontFamily:'monospace',color:'#c00',background:'#fff',margin:20,borderRadius:12,whiteSpace:'pre-wrap',fontSize:13}},'🚨 App crashed — check this error:\n\n'+this.state.err.message+'\n\n'+this.state.err.stack);return this.props.children;}}
ReactDOM.createRoot(document.getElementById('root')).render(el(ErrBoundary,null,el(App)));
